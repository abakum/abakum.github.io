function validRecord(r) {
    if (!(r && typeof r.n === "string" && r.n.trim() !== "" &&
        typeof r.d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(r.d))) return false;
    if ("h" in r && !(Number.isInteger(r.h) && r.h >= 0 && r.h <= 23)) return false;
    return !("m" in r) || (Number.isInteger(r.m) && r.m >= 0 && r.m <= 59);
}

function saveDb() {
    const json = JSON.stringify(db);
    if (byteLen(json) > QR_MAX_BYTES) {
        status("База слишком велика для QR (" + byteLen(json) + " > " + QR_MAX_BYTES + " байт)", true);
        return false;
    }
    localStorage.setItem(DB_KEY, json);
    return true;
}

    return n;
}

const sortDb = () => db.sort((a, b) => a.d.localeCompare(b.d) || ((a.h ?? 12) - (b.h ?? 12)) || ((a.m ?? 0) - (b.m ?? 0)));

function submitRecord() {
    const n = document.getElementById("fName").value.trim();
    const d = document.getElementById("fDate").value;
    const h = readNum("fHour", 23);
    const m = readNum("fMin", 59);
    if (!n || !/^\d{4}-\d{2}-\d{2}$/.test(d)) {
        status("Укажите имя и дату рождения", true);
        return;
    }
    if (h === null || m === null) {
        status("Час — целое 0–23, минуты — 0–59 (или пусто: 12:00)", true);
        return;
    }
    const city = document.getElementById("fCity").value;
    const hh = h === undefined ? 12 : h;
    const mm = m === undefined ? 0 : m;
    const rec = { n, d };
    if (h !== undefined) rec.h = h;
    if (m !== undefined) rec.m = m;
    let note = "";
    if (city) {
        const [y, mo, dd] = d.split("-").map(Number);
        const msk = new Date(Date.UTC(y, mo - 1, dd, hh, mm, 0) - cityDiffMin(city, d) * 60000);
        const pad = (x, l) => String(x).padStart(l, "0");
        rec.d = msk.getUTCFullYear() + "-" + pad(msk.getUTCMonth() + 1, 2) + "-" + pad(msk.getUTCDate(), 2);
        rec.h = msk.getUTCHours();
        rec.m = msk.getUTCMinutes();
        note = city + " " + pad(hh, 2) + ":" + pad(mm, 2) + " → МСК " + pad(rec.h, 2) + ":" + pad(rec.m, 2)
            + (rec.d !== d ? " " + rec.d : "");
    }
    if (editingIdx >= 0) {
        const old = db[editingIdx];
        db[editingIdx] = rec;
        if (!saveDb()) { db[editingIdx] = old; return; }
        cancelEdit();
    } else {
        if (adaSeeded) {
            adaSeeded = false;
            db = [];
        }
        db.push(rec);
        if (!saveDb()) { db.pop(); return; }
    }
    const sel = selectedIdx >= 0 ? db[selectedIdx] : null;
    sortDb();
    selectedIdx = sel ? db.indexOf(sel) : -1;
    document.getElementById("fName").value = "";
    document.getElementById("fDate").value = "";
    document.getElementById("fCity").value = "";
    status((note ? note + " • " : "") + "Записей: " + db.length + ", размер " + byteLen(JSON.stringify(db)) + "/" + QR_MAX_BYTES + " байт");
    renderList();
    refreshDbQr();
}

function startEdit(i) {
    editingIdx = i;
    document.getElementById("fName").value = db[i].n;
    document.getElementById("fDate").value = db[i].d;
    document.getElementById("fHour").value = "h" in db[i] ? db[i].h : "";
    document.getElementById("fMin").value = "m" in db[i] ? db[i].m : "";
    document.getElementById("fCity").value = "";
    const addBtn = document.getElementById("addBtn");
    addBtn.textContent = "💾";
    addBtn.title = "Сохранить";
}

function cancelEdit() {
    editingIdx = -1;
    const addBtn = document.getElementById("addBtn");
    addBtn.textContent = "➕";
    addBtn.title = "Добавить";
    document.getElementById("fName").value = "";
    document.getElementById("fDate").value = "";
    document.getElementById("fHour").value = "";
    document.getElementById("fMin").value = "";
    document.getElementById("fCity").value = "";
}

function removeRecord(i) {
    if (!confirm("Удалить " + db[i].n + " " + db[i].d + "?")) return;
    db.splice(i, 1);
    if (db.length === 0) adaSeeded = false;
    if (!saveDb()) { renderList(); refreshDbQr(); return; }
    if (selectedIdx === i) { selectedIdx = -1; hideResult(); }
    if (selectedIdx > i) selectedIdx--;
    if (editingIdx === i) cancelEdit();
    renderList();
    refreshDbQr();
    status("Удалено. Записей: " + db.length);
}

function hasTime(r) {
    return Number.isInteger(r.h) || Number.isInteger(r.m);
}

const mskDiffLabel = m => "МСК" + (m === 0 ? "" : (m > 0 ? "+" : "−") + Math.abs(m));

function renderCitySelect() {
    const sel = document.getElementById("fCity");
    sel.innerHTML = "";
    const def = document.createElement("option");
    def.value = "";
    def.textContent = "Город рождения — или время уже МСК";
    sel.appendChild(def);
    const groups = {};
    for (const c in CITY_ZONE) {
        const ep = ZONE_EPOCHS[CITY_ZONE[c]];
        const cur = ep[ep.length - 1];
        (groups[cur] = groups[cur] || []).push(c);
    }
    for (const g of Object.keys(groups).map(Number).sort((a, b) => (a === 0) - (b === 0) || a - b)) {
        const og = document.createElement("optgroup");
        og.label = g === 0 ? "Сейчас в МСК (раньше в другом поясе)" : mskDiffLabel(g);
        for (const c of groups[g].sort((a, b) => a.localeCompare(b, "ru"))) {
            const o = document.createElement("option");
            o.value = c;
            o.textContent = c + " (" + mskDiffLabel(g) + ")";
            og.appendChild(o);
        }
        sel.appendChild(og);
    }
}

function timeLabel(r) {
    const h = String(Number.isInteger(r.h) ? r.h : 12).padStart(2, "0");
    const m = String(Number.isInteger(r.m) ? r.m : 0).padStart(2, "0");
    return h + ":" + m;
}

function selectRecord(i) {
    selectedIdx = i;
    renderList();
    const r = db[i];
    const [y, mo, d] = r.d.split("-").map(Number);
    const h = Number.isInteger(r.h) ? r.h : 12;
    const m = Number.isInteger(r.m) ? r.m : 0;
    const t = new Date(Date.UTC(y, mo - 1, d, h, m, 0));
    const text = r.n + " " + r.d + (hasTime(r) ? " " + timeLabel(r) : "") + "\n" + la(t).join("\n");
    document.getElementById("resultTitle").textContent = r.n;
    document.getElementById("resultText").value = text;
    document.getElementById("resultText").rows = text.split("\n").length;
    showQr(document.getElementById("resultQr"), text);
    document.getElementById("resultSec").style.display = "block";
}

function hideResult() {
    document.getElementById("resultSec").style.display = "none";
}

function showQr(el, text) {
    try {
        const qr = qrcode(0, "L");
        qr.addData(text);
        qr.make();
        el.innerHTML = qr.createSvgTag(4, 8);
    } catch (e) {
        el.innerHTML = "";
        status("Не удалось создать QR: " + e.message, true);
    }
}

function copyResult() {
    copyText(document.getElementById("resultText").value);
}

function copyDb() {
    if (db.length === 0) {
        status("База пуста", true);
        return;
    }
    copyText(JSON.stringify(db));
}

function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
            () => status("Скопировано в буфер обмена"),
            () => fallbackCopy(text));
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
        document.execCommand("copy");
        status("Скопировано в буфер обмена");
    } catch (e) {
        status("Не удалось скопировать", true);
    }
    document.body.removeChild(ta);
}

function showDbQr() {
    const el = document.getElementById("dbQr");
    if (el.innerHTML) {
        el.innerHTML = "";
        return;
    }
    const json = JSON.stringify(db);
    if (db.length === 0) {
        status("База пуста", true);
        return;
    }
    showQr(el, json);
    status("QR базы: " + byteLen(json) + "/" + QR_MAX_BYTES + " байт, записей: " + db.length);
}

function pasteDb() {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
        status("Буфер обмена недоступен в этом браузере", true);
        return;
    }
    navigator.clipboard.readText().then(text => {
        let incoming;
        try {
            incoming = JSON.parse(text);
        } catch (e) {
            status("В буфере не JSON база данных", true);
            return;
        }
        if (!Array.isArray(incoming) || !incoming.every(validRecord)) {
            status("Неверный формат базы", true);
            return;
        }
        const replace = confirm("OK — заменить текущую базу (" + incoming.length + " зап.), Отмена — объединить");
        const merged = replace ? incoming : db.concat(incoming).filter((r, i, a) =>
            a.findIndex(x => x.n === r.n && x.d === r.d) === i);
        const backup = db;
        db = merged;
        sortDb();
        adaSeeded = false;
        if (!saveDb()) { db = backup; return; }
        selectedIdx = -1;
        hideResult();
        renderList();
        refreshDbQr();
        status("Записей: " + db.length + ", размер " + byteLen(JSON.stringify(db)) + "/" + QR_MAX_BYTES + " байт");
    }, () => status("Не удалось прочитать буфер обмена", true));
}

function loginYandex() {
    if (!YANDEX_CLIENT_ID) {
        status("YANDEX_CLIENT_ID не задан — зарегистрируйте приложение, см. README.md", true);
        return;
    }
    const redirect = location.origin + location.pathname;
    location = "https://oauth.yandex.ru/authorize?response_type=token&client_id="
        + encodeURIComponent(YANDEX_CLIENT_ID)
        + "&redirect_uri=" + encodeURIComponent(redirect);
}

function checkOAuthHash() {
    const m = location.hash.match(/access_token=([^&]+)/);
    if (!m) return;
    yandexToken = decodeURIComponent(m[1]);
    history.replaceState(null, "", location.pathname);
    document.getElementById("cloudPutBtn").style.display = "";
    document.getElementById("cloudGetBtn").style.display = "";
    const lb = document.getElementById("loginBtn");
    lb.textContent = "🔒";
    lb.title = "Выйти";
    lb.onclick = logoutYandex;
    status("Вход через Яндекс выполнен");
}

function logoutYandex() {
    yandexToken = "";
    document.getElementById("cloudPutBtn").style.display = "none";
    document.getElementById("cloudGetBtn").style.display = "none";
    const lb = document.getElementById("loginBtn");
    lb.textContent = "🔑";
    lb.title = "Войти через Яндекс";
    lb.onclick = loginYandex;
    status("Вы вышли из аккаунта");
}

function cloudPresign(action) {
    if (!FUNCTION_URL) {
        status("FUNCTION_URL не задан — разверните функцию, см. README.md", true);
        return Promise.reject();
    }
    if (!yandexToken) {
        status("Сначала войдите через Яндекс", true);
        return Promise.reject();
    }
    return fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: yandexToken, action })
    }).then(resp => {
        if (!resp.ok) throw new Error("функция вернула " + resp.status);
        return resp.json();
    }).then(data => {
        if (!data.url) throw new Error("функция не вернула url");
        return data;
    });
}

function cloudPut() {
    cloudPresign("put").then(data =>
        fetch(data.url, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(db)
        })
    ).then(resp => {
        if (!resp.ok) return resp.text().then(t => {
            throw new Error("S3 вернул " + resp.status + ": " + t.slice(0, 200));
        });
        status("База сохранена в облако. Записей: " + db.length);
    }).catch(e => status("Ошибка сохранения: " + e.message, true));
}

function cloudGet() {
    let presignBirthday = null;
    cloudPresign("get").then(data => {
        presignBirthday = data.birthday || null;
        return fetch(data.url);
    }).then(resp => {
        if (resp.status === 404) return null;
        if (!resp.ok) return resp.text().then(t => {
            throw new Error("S3 вернул " + resp.status + ": " + t.slice(0, 200));
        });
        return resp.text();
    }).then(text => {
        let incoming;
        let seeded = false;
        if (text === null) {
            if (presignBirthday && /^\d{4}-\d{2}-\d{2}$/.test(presignBirthday)) {
                incoming = [{ n: "Я", d: presignBirthday }];
            } else {
                incoming = [{ n: "Ада", d: "1815-12-10" }];
                seeded = true;
            }
        } else {
            try {
                incoming = JSON.parse(text);
            } catch (e) {
                throw new Error("в облаке не JSON");
            }
        }
        if (!Array.isArray(incoming) || !incoming.every(validRecord)) {
            throw new Error("неверный формат базы в облаке");
        }
        const replace = confirm("OK — заменить текущую базу (" + incoming.length + " зап.), Отмена — объединить");
        const merged = replace ? incoming : db.concat(incoming).filter((r, i, a) =>
            a.findIndex(x => x.n === r.n && x.d === r.d) === i);
        const backup = db;
        db = merged;
        sortDb();
        adaSeeded = seeded;
        if (!saveDb()) { db = backup; return; }
        selectedIdx = -1;
        hideResult();
        renderList();
        refreshDbQr();
        status(text === null
            ? (seeded
                ? "В облаке пусто и дата рождения в аккаунте не указана — заготовка: Ада"
                : "В облаке пусто — загружена дата рождения из аккаунта Яндекса")
            : "База загружена из облака. Записей: " + db.length);
    }).catch(e => status("Ошибка загрузки: " + e.message, true));
}

loadDb();
renderList();
renderCitySelect();
checkOAuthHash();
</script>
