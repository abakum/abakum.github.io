name: Deploy LunarReturns to VK Mini Apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Окружение деплоя на хостинг VK"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - production
      confirmation_code:
        description: "Код подтверждения (обязателен для production; приходит главному администратору)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: LunarReturns
        run: npm install --no-audit --no-fund

      # Dev-деплой полностью автоматический: код подтверждения не требуется.
      # В vk-hosting-config.json задан update_dev=1 — после выкладки VK сам
      # переключает dev-URL приложения на новую версию, поэтому stage-адрес
      # больше не нужен и из CI он скрывается: утилита всегда печатает его
      # в stdout, так что вывод деплоя перенаправляется в файл, маскируется
      # и только затем попадает в лог запуска.
      - name: Deploy to VK hosting (dev)
        if: github.event.inputs.environment == 'dev'
        working-directory: LunarReturns
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
          MINI_APPS_ENVIRONMENT: dev
        run: |
          status=0
          npm run deploy > "$RUNNER_TEMP/deploy.log" 2>&1 || status=$?
          sed -E 's#https://stage-app[^[:space:]]*#[stage-URL скрыт]#g' "$RUNNER_TEMP/deploy.log"
          exit $status

      # Production требует код подтверждения от главного администратора.
      # Псевдо-TTY (script) нужен, т.к. библиотека читает код из stdin, а у GitHub Actions нет TTY.
      - name: Deploy to VK hosting (production)
        if: github.event.inputs.environment == 'production'
        working-directory: LunarReturns
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
          MINI_APPS_ENVIRONMENT: production
          CI_URLS: 'true'
        run: |
          CODE="${{ github.event.inputs.confirmation_code }}"
          if [[ -z "$CODE" ]]; then
            echo "::error::Для production нужен confirmation_code (код от главного администратора). Получите его и перезапустите воркфлоу."
            exit 1
          fi
          printf '%s\n' "$CODE" | script -qec "npm run deploy" /dev/null | tee "$RUNNER_TEMP/deploy.log"

      # Выносит URL выложенной production-версии из лога деплоя в сводку
      # запуска (Summary) и в заметки шага (::notice). Для dev не выполняется:
      # stage-адрес из CI скрывается, URL приложения переключается автоматически.
      - name: URLs in summary
        if: github.event.inputs.environment == 'production'
        run: |
          LOG="$RUNNER_TEMP/deploy.log"
          [[ -f "$LOG" ]] || { echo "Лог деплоя не найден"; exit 0; }
          URLS=$(grep -oE 'https://[A-Za-z0-9._/-]+' "$LOG" | sort -u)
          [[ -n "$URLS" ]] || { echo "URL в выводе деплоя не найден"; exit 0; }
          {
            echo "## URL мини-аппа после выкладки"
            echo '```'
            echo "$URLS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r u; do echo "::notice::URL выложенной версии: $u"; done <<< "$URLS"