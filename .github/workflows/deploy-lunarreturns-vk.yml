name: Deploy LunarReturns to VK Mini Apps

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Выложить также в production (без галочки — только dev)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: LunarReturns
        run: npm install --no-audit --no-fund

      # Деплой выполняется одним шагом: без галочки — только dev
      # (MINI_APPS_ENVIRONMENT=dev), с галочкой production — одна и та же
      # версия выкладывается сразу в обе среды (любое значение
      # MINI_APPS_ENVIRONMENT, кроме dev/production, утилита трактует как
      # dev+production). Это избавляет от двойной загрузки версии.
      # Деплой полностью автоматический: сервисный ключ (MINI_APPS_ACCESS_TOKEN)
      # не требует кода подтверждения администратора. В vk-hosting-config.json
      # заданы update_dev=1 и update_prod=1 — после выкладки VK сам переключает
      # dev- и prod-URL приложения на новую версию. Реальные URL утилита
      # печатает в stdout (из-за CI_URLS), поэтому вывод деплоя перенаправляется
      # в файл, маскируется и только затем попадает в лог запуска.
      - name: Deploy to VK hosting
        working-directory: LunarReturns
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
          MINI_APPS_ENVIRONMENT: ${{ github.event.inputs.production == 'true' && 'all' || 'dev' }}
          CI_URLS: 'true'
        run: |
          status=0
          npm run deploy > "$RUNNER_TEMP/deploy.log" 2>&1 || status=$?
          sed -E 's#https://[^[:space:]]*#[URL скрыт]#g' "$RUNNER_TEMP/deploy.log"
          exit $status