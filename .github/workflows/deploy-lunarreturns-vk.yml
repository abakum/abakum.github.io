name: Deploy LunarReturns to VK Mini Apps

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Выложить также в production (без галочки — только dev)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: LunarReturns
        run: npm install --no-audit --no-fund

      # Dev-деплой полностью автоматический: код подтверждения не требуется.
      # В vk-hosting-config.json задан update_dev=1 — после выкладки VK сам
      # переключает dev-URL приложения на новую версию, поэтому stage-адрес
      # больше не нужен и из CI он скрывается: утилита всегда печатает его
      # в stdout, так что вывод деплоя перенаправляется в файл, маскируется
      # и только затем попадает в лог запуска.
      # Dev-деплой выполняется всегда.
      - name: Deploy to VK hosting (dev)
        working-directory: LunarReturns
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
          MINI_APPS_ENVIRONMENT: dev
        run: |
          status=0
          npm run deploy > "$RUNNER_TEMP/dev.log" 2>&1 || status=$?
          sed -E 's#https://stage-app[^[:space:]]*#[stage-URL скрыт]#g' "$RUNNER_TEMP/dev.log"
          exit $status

      # Production выполняется по чекбоксу и НЕ требует кода подтверждения:
      # сервисный ключ (MINI_APPS_ACCESS_TOKEN) позволяет выкладку без
      # подтверждения администратора (проверено экспериментальным деплоем).
      # Реальные production-URL печатаются утилитой в stdout (из-за CI_URLS),
      # поэтому вывод перенаправляется в файл и маскируется, чтобы URL не
      # попадали в лог запуска.
      - name: Deploy to VK hosting (production)
        if: github.event.inputs.production == 'true'
        working-directory: LunarReturns
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
          MINI_APPS_ENVIRONMENT: production
          CI_URLS: 'true'
        run: |
          status=0
          npm run deploy > "$RUNNER_TEMP/prod.log" 2>&1 || status=$?
          sed -E 's#https://[^[:space:]]*#[production-URL скрыт]#g' "$RUNNER_TEMP/prod.log"
          exit $status