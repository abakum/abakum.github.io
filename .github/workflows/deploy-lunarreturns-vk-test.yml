# [TEST] Проверка гипотезы: сервисный ключ позволяет деплой в production БЕЗ кода подтверждения.
#
# Гипотеза:
#   Решение о запросе кода подтверждения принимает сервер ВКонтакте, а не утилита
#   vk-miniapps-deploy. Если передан СЕРВИСНЫЙ ключ (Service Token), сервер понимает,
#   что это безличный CI/CD-ключ, и пропускает шаг подтверждения, сразу возвращая
#   события 201 (CODE_DEPLOY) и 202 (CODE_SKIP), не отдавая 205 (CODE_CONFIRM_SENT_VIA_MESSAGE).
#
# Отличие от основного воркфлоу:
#   - НЕТ input confirmation_code и НЕТ подстановки кода через псевдо-TTY.
#   - Деплой идёт напрямую с MINI_APPS_ENVIRONMENT=production и сервисным токеном.
#
# Как интерпретировать результат:
#   ✅ Успех — гипотеза подтверждена: сервисный ключ пропускает подтверждение.
#   ❌ Падение/зависание на "Please, enter code" — гипотеза опровергнута:
#      production всегда требует код, независимо от типа ключа.
name: "[TEST] Deploy LunarReturns to VK (service token, no confirm code)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Окружение деплоя"
        required: true
        default: "production"
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: LunarReturns
        run: npm install --no-audit --no-fund

      # Прямой деплой: только сервисный токен + окружение. Код подтверждения не передаём.
      - name: Deploy to VK hosting (production, no confirmation code)
        working-directory: LunarReturns
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
          MINI_APPS_ENVIRONMENT: ${{ github.event.inputs.environment }}
          CI_URLS: 'true'
        run: npm run deploy